<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>▶ Streamfare</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='0' y2='0'%3E%3Cstop offset='0' stop-color='%23991b1b'/%3E%3Cstop offset='.5' stop-color='%23ea580c'/%3E%3Cstop offset='1' stop-color='%23fbbf24'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3Cpath d='M6 12a7 7 0 0 0 0 8M3 9.5a10.5 10.5 0 0 0 0 13' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' opacity='.8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"><i></i><i></i></div>

  <!-- top bar -->
  <header class="navbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
        <defs>
          <linearGradient id="logo-fire" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#991b1b"/>
            <stop offset=".5" stop-color="#ea580c"/>
            <stop offset="1" stop-color="#fbbf24"/>
          </linearGradient>
          <linearGradient id="logo-play" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#fde68a"/>
            <stop offset="1" stop-color="#fff"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="8" fill="url(#logo-fire)"/>
        <path d="M12 9l11 7-11 7z" fill="url(#logo-play)"/>
        <circle class="ember" style="animation-delay:0s"  cx="10" cy="5" r="1.2" fill="#fde047"/>
        <circle class="ember" style="animation-delay:.6s" cx="18" cy="4" r="1"   fill="#fb923c"/>
        <circle class="ember" style="animation-delay:1.1s" cx="25" cy="6" r="1.1" fill="#fde047"/>
        <path d="M6 12a7 7 0 0 0 0 8M3 9.5a10.5 10.5 0 0 0 0 13" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
      </svg>
      Streamfare
    </div>
    <div class="navbar-right">
      <span class="status-pill" id="pill" data-state="idle"><i></i><b id="status">Idle</b></span>
      <button class="btn" id="theme">Theme</button>
    </div>
  </header>

  <main class="page">
    <!-- player -->
    <section class="card stage">
      <div class="video-box" id="box">
        <video id="video" controls playsinline autoplay></video>
        <div class="placeholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/></svg>
          Paste a stream link in Stream source to start watching
        </div>
        <div class="spinner"></div>
      </div>

      <div class="toolbar">
        <button class="btn" id="live" title="Jump to live edge"><span class="dot"></span>LIVE</button>
        <button class="btn" id="mute">Mute</button>
        <button class="btn" id="pip">PiP</button>
        <button class="btn" id="fullscreen">Fullscreen</button>
        <span class="spacer"></span>
        <span class="hint">Space play · L live · M mute · F fullscreen</span>
      </div>
    </section>

    <div class="columns">
      <!-- stream source -->
      <section class="card" id="sourceCard">
        <div class="card-head">
          Stream source
          <button class="chevron" id="sourceToggle" title="Show or hide">▾</button>
        </div>
        <div class="collapse"><div class="collapse-inner">
          <div class="fields">
            <div class="wide">
              <label for="url">Stream URL (m3u8 / ts / flv / mp4, or url|Header=value)</label>
              <input type="text" id="url" placeholder="https://example.com/live/stream.m3u8">
            </div>
            <div><label for="referer">Referer</label><input type="text" id="referer" placeholder="https://site.com/"></div>
            <div><label for="origin">Origin</label><input type="text" id="origin" placeholder="https://site.com"></div>
            <div><label for="ua">User-Agent</label><input type="text" id="ua" placeholder="optional"></div>
            <div><label for="cookie">Cookie</label><input type="text" id="cookie" placeholder="optional"></div>
            <div class="wide"><label for="auth">Authorization</label><input type="text" id="auth" placeholder="Bearer ... (optional)"></div>
            <div class="wide actions">
              <button class="btn primary" id="load">Load stream</button>
              <button class="btn" id="clear">Clear saved</button>
              <label class="check"><input type="checkbox" id="useProxy" checked> Use local proxy</label>
            </div>
          </div>
        </div></div>
      </section>

      <!-- playback controls -->
      <section class="card">
        <div class="card-head">Playback controls</div>

        <div class="group">
          <h4>Audio</h4>
          <label for="volume">Volume <span class="value" id="volumeValue"></span></label>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>

        <div class="group">
          <h4>Picture</h4>
          <div class="row">
            <div><label for="brightness">Brightness <span class="value" id="brightnessValue"></span></label><input type="range" id="brightness" min="0.3" max="2" step="0.05" value="1"></div>
            <div><label for="contrast">Contrast <span class="value" id="contrastValue"></span></label><input type="range" id="contrast" min="0.3" max="2" step="0.05" value="1"></div>
            <div><label for="saturation">Saturation <span class="value" id="saturationValue"></span></label><input type="range" id="saturation" min="0" max="2" step="0.05" value="1"></div>
            <div>
              <label for="fit">Fit</label>
              <select id="fit"><option value="contain">Fit</option><option value="cover">Fill</option><option value="fill">Stretch</option></select>
            </div>
          </div>
        </div>

        <div class="group">
          <h4>Playback</h4>
          <div class="row">
            <div><label for="quality">Quality</label><select id="quality"><option value="-1">Auto</option></select></div>
            <div>
              <label for="speed">Speed</label>
              <select id="speed"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- libraries (loaded as globals: Hls, mpegts) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
