<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Streamfare banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080c"/>
      <stop offset="1" stop-color="#1c0e08"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#991b1b"/>
      <stop offset=".5" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f97316" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- background glows -->
  <circle cx="190" cy="160" r="260" fill="url(#glowA)">
    <animate attributeName="opacity" values=".6;1;.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="300" r="300" fill="url(#glowB)">
    <animate attributeName="opacity" values="1;.55;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- logo -->
  <g transform="translate(90 90) scale(4.4)">
    <rect width="32" height="32" rx="8" fill="url(#fire)"/>
    <path d="M12 9l11 7-11 7z" fill="#fff"/>
    <path d="M6 12a7 7 0 0 0 0 8M3 9.5a10.5 10.5 0 0 0 0 13" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- rising embers -->
  <g fill="#fde047">
    <circle cx="130" cy="86" r="4"><animate attributeName="cy" values="92;54" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="80" r="3" fill="#fb923c"><animate attributeName="cy" values="88;46" dur="2.8s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle cx="235" cy="90" r="3.5"><animate attributeName="cy" values="96;58" dur="2.5s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- wordmark -->
  <text x="270" y="172" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="88" font-weight="700" fill="#eceff4" letter-spacing="1">Stream<tspan fill="url(#word)">fare</tspan></text>
  <text x="274" y="222" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" fill="#9aa3b2">Your own network stream player. Fast, private and on fire.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
